org: zmrfzn
app: sls-nr-dev
service: nr-layer-sls
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1

functions:
  api:
    name: "Node-Lambda-NR_layer"
    handler: index.handler
    events:
      - httpApi: '*'
    environment:
        OTEL_SERVICE_NAME: "Node-Lambda-NR_layer"
        EXPRESS_OTEL_API_ENDPOINT: 'http://3.230.230.121/v3/api'
        
    layers:
      - arn:aws:lambda:us-east-1:451483290750:layer:NewRelicNodeJS18X:84

plugins:
  - serverless-offline
  - serverless-newrelic-lambda-layers


custom:
  newRelic:
    enableIntegration: true
    accountId: 3680965
    apiKey: '${ssm:/nr_experiments_ingest_key}'
    enableFunctionLogs: true
    enableExtension: true
    logLevel: debug


dashboard:
  disableMonitoring: true

package:
  excludeDevDependencies: true